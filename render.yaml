services:
  - type: web
    name: eti-hub
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: node dist/server/server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eti-hub-db
          property: connectionString
      - key: CLIENT_URL
        value: https://eti-hub.onrender.com
      - key: PORT
        value: 10000
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: eu-west-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: hub@etiandpartners.com

databases:
  - name: eti-hub-db
    plan: free
    databaseName: eti_hub
    user: eti_hub_user
